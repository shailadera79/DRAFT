name: Ollama Server Host

on:
  workflow_dispatch: # Actions tab se manually start karne ke liye

jobs:
  run-ollama:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tailscale connection setup
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Winget se Ollama install karna
      - name: Install Ollama
        shell: cmd
        run: |
          winget install Ollama.Ollama --accept-source-agreements --accept-package-agreements

      # Background me chal rahe pehle ke Ollama process ko kill karna
      - name: Kill existing Ollama process
        shell: cmd
        run: |
          taskkill /f /im ollama.exe 2>nul || exit 0

      # Host set karke Ollama serve start karna aur 7B model pull karna
      - name: Setup Host, Start Ollama and Download 7B Model
        shell: cmd
        run: |
          set OLLAMA_HOST=0.0.0.0
          start /B ollama serve
          timeout /t 10 /nobreak
          ollama pull qwen2.5:7b

      # CMD session/workflow ko open rakhne ke liye infinite loop
      - name: Keep Workflow Alive
        shell: cmd
        run: |
          echo Ollama Server is running on port 11434...
          powershell -Command "while ($true) { Start-Sleep -Seconds 3600 }"
