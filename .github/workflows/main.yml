name: Ollama Server Host

on:
  workflow_dispatch: # Actions tab se manually start karne ke liye

jobs:
  run-ollama:
    runs-on: ubuntu-latest # Windows ki jagah Ubuntu (Linux) use karein

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tailscale connection setup
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Ollama install karna
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # Background me chal rahe pehle ke Ollama process ko stop karna
      - name: Kill existing Ollama process
        run: |
          pkill ollama || true

      # Host set karke Ollama serve start karna aur 7B model pull karna
      - name: Setup Host, Start Ollama and Download 7B Model
        run: |
          export OLLAMA_HOST=0.0.0.0
          ollama serve &
          sleep 10
          ollama pull qwen2.5:7b

      # Workflow ko active/open rakhne ke liye infinite loop
      - name: Keep Workflow Alive
        run: |
          echo "Ollama Server is running on port 11434..."
          sleep infinity
