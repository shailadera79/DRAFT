name: Ollama Server Host

on:
  workflow_dispatch:

jobs:
  run-ollama:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tailscale Auth Key se connect karein
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # Ollama install karna
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # Background me chal rahe pehle ke Ollama process ko stop karna
      - name: Kill existing Ollama process
        run: |
          pkill ollama || true

      # Host set karke Ollama serve start karna aur 7B model pull karna
      - name: Setup Host, Start Ollama and Download 7B Model
        run: |
          export OLLAMA_HOST=0.0.0.0
          ollama serve &
          sleep 10
          ollama pull qwen2.5:7b

      # Workflow ko active/open rakhne ke liye infinite loop
      - name: Keep Workflow Alive
        run: |
          echo "Ollama Server is running on port 11434..."
          sleep infinity
